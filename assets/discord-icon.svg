<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#1a1440"/>
      <stop offset="1" stop-color="#07060f"/>
    </radialGradient>
    <radialGradient id="glowc" cx="30%" cy="30%" r="50%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".35"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowp" cx="72%" cy="70%" r="50%">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".45"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7df9ff"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <linearGradient id="b" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c4b5fd"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
    <linearGradient id="c" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0e7490"/><stop offset="1" stop-color="#4c1d95"/></linearGradient>
    <linearGradient id="d" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6d28d9"/><stop offset="1" stop-color="#2e1065"/></linearGradient>
    <filter id="glow" filterUnits="userSpaceOnUse" x="-10" y="-10" width="84" height="84">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glowc)"/>
  <rect width="512" height="512" fill="url(#glowp)"/>
  <!-- crystal: logo 64-unit geometry scaled 6x, centred -->
  <g transform="translate(64 64) scale(6)">
    <polygon points="32,3 11,23 32,30" fill="url(#a)"/>
    <polygon points="32,3 53,23 32,30" fill="url(#b)"/>
    <polygon points="11,23 32,30 32,61" fill="url(#c)"/>
    <polygon points="53,23 32,30 32,61" fill="url(#d)"/>
    <polyline points="32,3 32,30 32,61" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width=".5"/>
    <polyline points="11,23 32,30 53,23" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width=".5"/>
    <polyline points="24,12 31,24 26,33 37,43 33,52" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow)"/>
    <rect x="4" y="36" width="5" height="5" rx="1" transform="rotate(45 6.5 38.5)" fill="#22d3ee"/>
    <rect x="55" y="40" width="4" height="4" rx="1" transform="rotate(45 57 42)" fill="#a78bfa"/>
  </g>
</svg>
